spring.application.name=reservas-backend
server.port=8081

# H2 en memoria: se recrea en cada arranque y se puebla con datos ficticios (DatosIniciales)
spring.datasource.url=jdbc:h2:mem:reservas;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Horario de funcionamiento de la sede
reservas.horario.apertura=08:00
reservas.horario.cierre=22:00
